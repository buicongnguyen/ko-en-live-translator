<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Speech to English Translator</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="translator-shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-name">LiveTranslate AI</span>
          <span class="brand-subtitle">Speech to English</span>
        </a>

        <div class="toolbar">
          <label class="language-control" for="source-language">
            <span>Source</span>
            <select id="source-language" class="select-field">
              <option value="auto">Auto detect</option>
              <option value="ko" selected>Korean</option>
              <option value="ja">Japanese</option>
              <option value="zh">Chinese</option>
              <option value="vi">Vietnamese</option>
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="ru">Russian</option>
              <option value="ar">Arabic</option>
              <option value="hi">Hindi</option>
              <option value="th">Thai</option>
              <option value="id">Indonesian</option>
              <option value="ms">Malay</option>
              <option value="tl">Tagalog</option>
              <option value="tr">Turkish</option>
              <option value="pl">Polish</option>
              <option value="nl">Dutch</option>
              <option value="uk">Ukrainian</option>
            </select>
          </label>

          <div class="button-row">
            <button id="start-button" class="primary">Start mic</button>
            <button id="stop-button" class="secondary" disabled>Stop</button>
            <button id="clear-transcript-button" class="secondary">Clear</button>
          </div>

          <div class="status-cluster" aria-label="Translator status">
            <span class="pill" id="connection-pill">Connecting</span>
            <span class="pill subtle" id="state-pill">Idle</span>
            <span class="pill subtle compact-model" id="model-pill">Model: loading</span>
          </div>

          <a class="nav-link" href="/static/about.html" target="_blank" rel="noreferrer">
            About
          </a>
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="status-text">Waiting for the local translator service.</span>
        <span id="latency-text">Latency: -</span>
        <span id="audio-text">Audio: -</span>
      </section>

      <section class="translation-workspace" aria-label="Live translation">
        <article class="translation-column source-box">
          <div class="column-toolbar">
            <div>
              <div class="block-label" id="source-language-label">Korean</div>
              <h1>Source transcript</h1>
            </div>
            <button id="copy-source-button" class="secondary compact-button">
              Copy Korean
            </button>
          </div>
          <div
            id="source-transcript"
            class="transcript-body"
            role="textbox"
            aria-label="Source transcript"
            tabindex="0"
          >
            <p class="empty-copy">
              Source transcript will appear here after you start listening.
            </p>
          </div>
        </article>

        <article class="translation-column english-box">
          <div class="column-toolbar">
            <div>
              <div class="block-label">English</div>
              <h1>Translation</h1>
            </div>
            <button id="copy-english-button" class="secondary compact-button">
              Copy English
            </button>
          </div>
          <div
            id="english-transcript"
            class="transcript-body"
            role="textbox"
            aria-label="English translation"
            tabindex="0"
          >
            <p class="empty-copy">English translation will appear here.</p>
          </div>
        </article>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
